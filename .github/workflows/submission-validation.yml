name: submission-validation

on:
  pull_request:
    paths:
      - 'Data Structures & Algorithms/**/*.py'
      - 'tools/validate_submissions.py'
      - '.github/workflows/submission-validation.yml'
  push:
    paths:
      - 'Data Structures & Algorithms/**/*.py'
      - 'tools/validate_submissions.py'
      - '.github/workflows/submission-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate changed submissions (pull request)
        if: github.event_name == 'pull_request'
        run: |
          python tools/validate_submissions.py --changed-only --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.sha }}"

      - name: Validate changed submissions (push)
        if: github.event_name == 'push'
        run: |
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            python tools/validate_submissions.py
          else
            python tools/validate_submissions.py --changed-only --base "${{ github.event.before }}" --head "${{ github.sha }}"
          fi
